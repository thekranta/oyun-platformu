<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      BU DOSYA Expo web sablonudur (SPA / web.output "single"): Expo dil ve baslik yer tutucularini ILK gectikleri yerde
      doldurur ve uygulama komut dosyalarini govdenin kapanis etiketinden hemen once (ilk eslesen yere) ekler. Bu yuzden
      yer tutucu metinleri, root ogesini ve kapanis etiketlerini SILME ya da yorumlarin icinde TEKRARLAMA.
      Varsayilan sablondan tek fark: #boot-splash (acilis perdesi) ve altindaki kucuk komut dosyasi.
      (lib/bootSplashTemplate.test.ts bu kurallari korur.)
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Acilis perdesi: ana JS paketi (~1,3 MB) inip calisana kadar bos ekran yerine maskot + "Yukleniyor" gosterir.
      Zemin, giris ekraniyla (components/DynamicBackground.tsx) ayni gradyan; baslik rengi giris basligiyla (#1565C0) ayni.
      Uygulama ilk gercek ekranini cizince lib/bootSplash.ts perdeyi kaldirir (app/_layout.tsx).
    -->
    <style id="boot-splash-style">
      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: linear-gradient(180deg, #E3F2FD 0%, #BBDEFB 30%, #FFF8E1 70%, #FFF3E0 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        transition: opacity 0.3s ease;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 88px;
        height: 88px;
        margin-bottom: 8px;
        animation: boot-bob 1.6s ease-in-out infinite;
      }
      #boot-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #1565C0;
      }
      #boot-dots {
        display: flex;
        gap: 8px;
        margin: 18px 0 14px;
      }
      #boot-dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #1565C0;
        opacity: 0.25;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      #boot-dots i:nth-child(2) { animation-delay: 0.2s; }
      #boot-dots i:nth-child(3) { animation-delay: 0.4s; }
      #boot-msg {
        min-height: 22px;
        font-size: 16px;
        color: #546E7A;
      }
      #boot-retry {
        margin-top: 16px;
        padding: 10px 26px;
        border: 0;
        border-radius: 999px;
        background: #2E7D32;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      #boot-retry[hidden] { display: none; }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash { transition: none; }
        #boot-splash img, #boot-dots i { animation: none; }
        #boot-dots i { opacity: 0.6; }
      }
    </style>
  </head>

    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        // Dil: uygulamayla ayni kural (lib/i18n.ts): kayitli secim, yoksa cihaz dili Ingilizce ise EN, aksi halde TR.
        var lang = null;
        try { lang = localStorage.getItem('app-language'); } catch (e) {}
        if (lang !== 'en' && lang !== 'tr') lang = /^en/i.test(navigator.language || '') ? 'en' : 'tr';
        var T = {
          tr: { title: 'MiniZeka', load: 'Yükleniyor…', slow: 'Bağlantı yavaş, biraz daha bekliyoruz…', fail: 'Yüklenemedi mi? Sayfayı yenile.', retry: 'Yenile' },
          en: { title: 'MiniZeka', load: 'Loading…', slow: 'Slow connection, hang on…', fail: 'Not loading? Reload the page.', retry: 'Reload' }
        }[lang];
        var msg = document.getElementById('boot-msg');
        var btn = document.getElementById('boot-retry');
        document.getElementById('boot-title').textContent = T.title;
        msg.textContent = T.load;
        btn.textContent = T.retry;
        btn.onclick = function () { location.reload(); };
        function alive() { return !!document.getElementById('boot-splash'); }
        function fail() { if (alive()) { msg.textContent = T.fail; btn.hidden = false; } }
        // Perdeyi kaldirir (uygulama ilk ekranini cizince lib/bootSplash.ts cagirir).
        window.__bootSplashHide = function () {
          var el = document.getElementById('boot-splash');
          if (!el || el.className.indexOf('boot-hide') >= 0) return;
          el.className += ' boot-hide';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
        };
        // Yavas baglanti: 8 sn sonra bilgi, 25 sn sonra "Yenile" dugmesi; komut dosyasi yuklenemezse hemen dugme.
        setTimeout(function () { if (alive()) msg.textContent = T.slow; }, 8000);
        setTimeout(fail, 25000);
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT') fail();
        }, true);
        // Guvenlik agi: uygulama perdeyi kaldirmayi unutursa (hata vb.), #root dolduktan 5 sn sonra kendiliginden kalkar.
        var root = document.getElementById('root');
        var seen = 0;
        var iv = setInterval(function () {
          if (!alive()) { clearInterval(iv); return; }
          if (root && root.childNodes.length) {
            seen = seen || Date.now();
            if (Date.now() - seen > 5000) { window.__bootSplashHide(); clearInterval(iv); }
          }
        }, 500);
      })();
    </script>
